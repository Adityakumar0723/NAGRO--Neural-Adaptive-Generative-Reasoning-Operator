version: '3.8'

services:
  nagro:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./models:/app/models
      - ./outputs:/app/outputs
      - ./data:/app/data
      - ./plugins:/app/plugins
      - hf_cache:/root/.cache/huggingface
    environment:
      - NAGRO_LLM_MODEL=Qwen/Qwen2.5-1.5B-Instruct
      - HF_HOME=/root/.cache/huggingface
    restart: unless-stopped

volumes:
  hf_cache:
